name: WebDroid static checks

on:
  push:
    branches: [main]
    paths:
      - "webdroid/**"
      - "scripts/check-webdroid.mjs"
      - ".github/workflows/webdroid-checks.yml"
  pull_request:
    paths:
      - "webdroid/**"
      - "scripts/check-webdroid.mjs"
      - ".github/workflows/webdroid-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and project wiring
        run: node scripts/check-webdroid.mjs
