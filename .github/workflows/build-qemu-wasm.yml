name: Build QEMU WebAssembly engines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-qemu-wasm.sh"
      - "scripts/check-qemu-wasm.sh"
      - "scripts/serve-coi.py"
      - "scripts/smoke-qemu-wasm.mjs"
      - "webdroid/engine/**"
      - ".github/workflows/build-qemu-wasm.yml"

permissions:
  contents: read

concurrency:
  group: webdroid-qemu-wasm-build
  cancel-in-progress: true

jobs:
  build-qemu-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out WebDroid
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QEMU/Wasm and two Linux guest images
        run: bash scripts/build-qemu-wasm.sh

      - name: Verify generated engines and guest assets
        run: bash scripts/check-qemu-wasm.sh

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start isolated static test server
        run: |
          python3 scripts/serve-coi.py --root webdroid --port 8765 > /tmp/webdroid-coi-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/qemu-smoke/raspi3ap.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/qemu-smoke/raspi3ap.html >/dev/null

      - name: Boot ARM64 and x86_64 Linux guests in Chromium
        run: node scripts/smoke-qemu-wasm.mjs

      - name: Upload QEMU WebAssembly engines and Linux guest assets
        uses: actions/upload-artifact@v4
        with:
          name: webdroid-qemu-wasm-engines
          path: webdroid/runtime/
          if-no-files-found: error
          retention-days: 14
